[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o2-lease"
version = "0.1.0"
description = "O2: lease-based search loop against mid-run select/mutate stagnation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "O2" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
o2 = "o2.__main__:main"

[tool.setuptools.packages.find]
include = ["o2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
